name: AIGate LibreChat Production

on:
  push:
    branches:
      - codex/aigate-sso-billing
      - aigate-production
  workflow_dispatch:

concurrency:
  group: aigate-librechat-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on OVH
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure pinned production host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [ "$DEPLOY_PORT" = 22 ]; then host_lookup="$DEPLOY_HOST"; else host_lookup="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
          ssh-keygen -F "$host_lookup" -f ~/.ssh/known_hosts >/dev/null

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          DEPLOY_REPO: https://github.com/${{ github.repository }}.git
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}
          LIBRECHAT_PUBLIC_URL: https://chat.aigate.shop
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_REPO='$DEPLOY_REPO' DEPLOY_BRANCH='$DEPLOY_BRANCH' DEPLOY_SHA='$DEPLOY_SHA' LIBRECHAT_PUBLIC_URL='$LIBRECHAT_PUBLIC_URL' bash -s" \
            < ops/deploy-aigate-production.sh

      - name: Smoke public URL when DNS exists
        run: bash ops/smoke-aigate-production.sh
