version: 1.3.13
cache: true

interface:
  modelSelect: true
  endpointsMenu: false
  parameters: true

endpoints:
  custom:
    - name: "AIGate"
      apiKey: "server_managed"
      baseURL: "${AIGATE_API_BASE_URL}"
      models:
        default:
          - "openai/gpt-5.4-mini"
          - "openai/gpt-5.5"
          - "anthropic/claude-sonnet-5"
          - "anthropic/claude-opus-4.8"
          - "google/gemini-3.5-flash"
        fetch: true
      titleConvo: true
      titleModel: "openai/gpt-5.4-mini"
      modelDisplayLabel: "AIGate"
