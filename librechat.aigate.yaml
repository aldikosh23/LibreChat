version: 1.3.13
cache: true

summarization:
  enabled: true
  provider: "AIGate"
  model: "openai/gpt-5.4-mini"
  maxContextTokens: 200000
  reserveRatio: 0

interface:
  modelSelect: true
  endpointsMenu: false
  parameters: true

endpoints:
  custom:
    - name: "AIGate"
      apiKey: "server_managed"
      baseURL: "${AIGATE_API_BASE_URL}"
      models:
        default:
          - "openai/gpt-5.4-mini"
          - "openai/gpt-5.5"
          - "anthropic/claude-sonnet-5"
          - "anthropic/claude-opus-4.8"
          - "google/gemini-3.5-flash"
        fetch: true
      titleConvo: true
      titleModel: "openai/gpt-5.4-mini"
      modelDisplayLabel: "AIGate"
      customParams:
        reasoningFormat: "reasoning_object"
        paramDefinitions:
          - key: "reasoning_effort"
            label: "com_endpoint_reasoning_effort"
            labelCode: true
            description: "com_endpoint_openai_reasoning_effort"
            descriptionCode: true
            type: "enum"
            default: ""
            component: "slider"
            options:
              - ""
              - "low"
              - "medium"
              - "high"
              - "xhigh"
            enumMappings:
              "": "com_ui_off"
              low: "com_ui_low"
              medium: "com_ui_medium"
              high: "com_ui_high"
              xhigh: "com_ui_xhigh"
            optionType: "model"
            columnSpan: 4
