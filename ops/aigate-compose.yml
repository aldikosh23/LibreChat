name: librechat-aigate

services:
  api:
    image: ${LIBRECHAT_IMAGE}
    container_name: librechat-aigate
    restart: unless-stopped
    depends_on:
      - mongodb
      - meilisearch
      - rag_api
    ports:
      - "127.0.0.1:${LIBRECHAT_PORT:-3080}:3080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
      RAG_PORT: ${RAG_PORT:-8000}
      RAG_API_URL: http://rag_api:${RAG_PORT:-8000}
      NO_PROXY: localhost,127.0.0.1,::1,mongodb,meilisearch,rag_api,vectordb,host.docker.internal
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./skill:/app/skill

  mongodb:
    image: mongo:8.0.20
    container_name: librechat-aigate-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    command: mongod --noauth

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    container_name: librechat-aigate-meilisearch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - meili_data:/meili_data

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    container_name: librechat-aigate-vectordb
    restart: unless-stopped
    environment:
      POSTGRES_DB: librechat
      POSTGRES_USER: librechat
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD}
    volumes:
      - pgvector_data:/var/lib/postgresql/data

  rag_api:
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    container_name: librechat-aigate-rag-api
    restart: unless-stopped
    depends_on:
      - vectordb
    env_file:
      - .env
    environment:
      DB_HOST: vectordb
      DB_PORT: 5432
      DB_NAME: librechat
      DB_USER: librechat
      DB_PASSWORD: ${RAG_POSTGRES_PASSWORD}
      RAG_PORT: ${RAG_PORT:-8000}

volumes:
  mongodb_data:
  meili_data:
  pgvector_data:
